name: iOS Validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - ios-kmp-migration

defaults:
  run:
    shell: bash

concurrency:
  group: ios-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-tests:
    runs-on: macos-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show tool versions
        run: |
          sw_vers
          xcodebuild -version
          java -version
          ./gradlew --version
          xcrun simctl list runtimes available

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Run shared checks
        run: ./gradlew :shared:check

      - name: Generate iOS project
        working-directory: iosApp
        run: xcodegen generate

      - name: Select simulator
        id: simulator
        run: |
          xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          candidates = []
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      candidates.append((device["name"] != "iPhone 16", device["name"], runtime, device))
          if not candidates:
              raise SystemExit("No available iPhone simulator")
          _, _, runtime, device = sorted(candidates, key=lambda item: (item[0], item[1], item[2]))[0]
          print("id={}".format(device["udid"]))
          print("name={}".format(device["name"]))
          print(f"runtime={runtime}")
          ' > "$RUNNER_TEMP/selected-simulator.env"
          cat "$RUNNER_TEMP/selected-simulator.env"
          cat "$RUNNER_TEMP/selected-simulator.env" >> "$GITHUB_OUTPUT"

      - name: Boot selected simulator
        run: |
          xcrun simctl boot "${{ steps.simulator.outputs.id }}" || true
          xcrun simctl bootstatus "${{ steps.simulator.outputs.id }}" -b

      - name: Run iOS unit tests
        working-directory: iosApp
        run: |
          rm -rf "$RUNNER_TEMP/XJTUToolboxIOS-tests.xcresult"
          xcodebuild test \
            -project XJTUToolboxIOS.xcodeproj \
            -scheme XJTUToolboxIOS \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -resultBundlePath "$RUNNER_TEMP/XJTUToolboxIOS-tests.xcresult" \
            -parallel-testing-enabled NO

      - name: Upload XCTest result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcresult
          path: ${{ runner.temp }}/XJTUToolboxIOS-tests.xcresult
          if-no-files-found: ignore

      - name: Build unsigned iOS Release archive
        run: |
          rm -rf "$RUNNER_TEMP/XJTUToolboxIOS.xcarchive"
          xcodebuild archive \
            -project iosApp/XJTUToolboxIOS.xcodeproj \
            -scheme XJTUToolboxIOS \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/XJTUToolboxIOS.xcarchive" \
            CODE_SIGNING_ALLOWED=NO

      - name: Validate unsigned iOS Release archive
        run: iosApp/scripts/validate-release-archive.sh "$RUNNER_TEMP/XJTUToolboxIOS.xcarchive"
