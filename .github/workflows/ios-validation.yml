name: iOS Validation

on:
  pull_request:
  push:
    branches:
      - main
      - ios-kmp-migration

jobs:
  ios-tests:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run shared checks
        run: ./gradlew :shared:check

      - name: Generate iOS project
        working-directory: iosApp
        run: xcodegen generate

      - name: Select simulator
        id: simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit
          raise SystemExit("No available iPhone simulator")
          ')
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Run iOS unit tests
        working-directory: iosApp
        run: |
          xcodebuild test \
            -project XJTUToolboxIOS.xcodeproj \
            -scheme XJTUToolboxIOS \
            -destination "id=${{ steps.simulator.outputs.id }}"

      - name: Build iOS Release configuration
        working-directory: iosApp
        run: |
          xcodebuild build \
            -project XJTUToolboxIOS.xcodeproj \
            -scheme XJTUToolboxIOS \
            -configuration Release \
            -destination "id=${{ steps.simulator.outputs.id }}"
