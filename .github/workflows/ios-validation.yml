name: iOS Validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - ios-kmp-migration

defaults:
  run:
    shell: bash

concurrency:
  group: ios-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-tests:
    runs-on: macos-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Run iOS automated release gate
        run: iosApp/scripts/run-automated-release-gate.sh

      - name: Upload XCTest result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcresult
          path: ${{ runner.temp }}/XJTUToolboxIOS-tests.xcresult
          if-no-files-found: ignore
