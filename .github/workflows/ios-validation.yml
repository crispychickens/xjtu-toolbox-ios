name: iOS Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ios-validation.yml"
      - "iosApp/**"
      - "shared/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "**/*.gradle.kts"
      - "gradle.properties"
  push:
    branches:
      - main
      - ios-kmp-migration
    paths:
      - ".github/workflows/ios-validation.yml"
      - "iosApp/**"
      - "shared/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "**/*.gradle.kts"
      - "gradle.properties"

defaults:
  run:
    shell: bash

concurrency:
  group: ios-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run shared checks
        run: ./gradlew :shared:check

  ios-unit-tests:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Run iOS unit and contract checks
        env:
          IOS_AUTOMATED_RELEASE_GATE_SKIP_SHARED_CHECK: "1"
        run: iosApp/scripts/run-ios-ci-checks.sh

      - name: Upload XCTest result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcresult
          path: ${{ runner.temp }}/XJTUToolboxIOS-tests.xcresult
          if-no-files-found: ignore
