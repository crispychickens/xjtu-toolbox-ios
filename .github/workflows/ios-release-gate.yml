name: iOS Release Gate
run-name: iOS Release Gate · ${{ github.ref_name }} · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ios-release-validation
      - ios-full-release-validation
    paths:
      - ".github/workflows/ios-release-gate.yml"
      - "iosApp/**"
      - "shared/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "**/*.gradle.kts"
      - "gradle.properties"

defaults:
  run:
    shell: bash

concurrency:
  group: ios-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: macos-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Run iOS automated release gate
        env:
          IOS_AUTOMATED_RELEASE_GATE_SKIP_TESTS: ${{ github.ref_name == 'ios-release-validation' && '1' || '0' }}
        run: |
          gate_log="${RUNNER_TEMP}/XJTUToolboxIOS-release-gate.log"
          set +e
          set -o pipefail
          iosApp/scripts/run-automated-release-gate.sh 2>&1 | tee "$gate_log"
          gate_status="${PIPESTATUS[0]}"
          set -e

          if [[ "$gate_status" -ne 0 ]]; then
            diagnostic_line="$(grep -E '(^|[[:space:]])(error:|fatal error:)|\*\* (BUILD|TEST|ARCHIVE) FAILED \*\*' "$gate_log" | tail -n 1 || true)"
            if [[ -z "$diagnostic_line" ]]; then
              diagnostic_line="$(tail -n 1 "$gate_log")"
            fi
            diagnostic_line="${diagnostic_line//'%'/'%25'}"
            diagnostic_line="${diagnostic_line//$'\r'/'%0D'}"
            diagnostic_line="${diagnostic_line//$'\n'/'%0A'}"
            echo "::error title=iOS release gate failed::$diagnostic_line"

            {
              echo "## iOS release gate failure tail"
              echo '```text'
              tail -n 80 "$gate_log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$gate_status"

      - name: Upload release-gate diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-gate-diagnostics
          path: |
            ${{ runner.temp }}/XJTUToolboxIOS-release-gate.log
            ${{ runner.temp }}/XJTUToolboxIOS-tests.xcresult
            ${{ runner.temp }}/XJTUToolboxIOS-archive.xcresult
          if-no-files-found: ignore
          retention-days: 7
