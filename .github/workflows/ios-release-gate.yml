name: iOS Release Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ios-release-validation
    paths:
      - ".github/workflows/ios-release-gate.yml"
      - "iosApp/**"
      - "shared/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "**/*.gradle.kts"
      - "gradle.properties"

defaults:
  run:
    shell: bash

concurrency:
  group: ios-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: macos-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Run iOS automated release gate
        run: |
          set -o pipefail
          iosApp/scripts/run-automated-release-gate.sh 2>&1 | tee "${RUNNER_TEMP}/XJTUToolboxIOS-release-gate.log"

      - name: Upload release-gate diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-gate-diagnostics
          path: |
            ${{ runner.temp }}/XJTUToolboxIOS-release-gate.log
            ${{ runner.temp }}/XJTUToolboxIOS-tests.xcresult
            ${{ runner.temp }}/XJTUToolboxIOS-archive.xcresult
          if-no-files-found: ignore
          retention-days: 7
