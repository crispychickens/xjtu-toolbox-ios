name: XJTUToolboxIOS
options:
  bundleIdPrefix: com.xjtu.toolbox
targets:
  XJTUToolboxIOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - XJTUToolboxIOS
    preBuildScripts:
      - name: Build KMP Shared Framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    info:
      path: XJTUToolboxIOS/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSExceptionDomains:
            rg.lib.xjtu.edu.cn:
              NSIncludesSubdomains: false
              NSExceptionAllowsInsecureHTTPLoads: true
            org.xjtu.edu.cn:
              NSIncludesSubdomains: false
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.xjtu.toolbox.ios
      MARKETING_VERSION: 1.0.0
      CURRENT_PROJECT_VERSION: 1
      VERSIONING_SYSTEM: apple-generic
      TARGETED_DEVICE_FAMILY: 1
      FRAMEWORK_SEARCH_PATHS:
        - "$(inherited)"
        - "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
      OTHER_LDFLAGS:
        - "$(inherited)"
        - "-framework"
        - "XJTUToolboxShared"
  XJTUToolboxIOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - XJTUToolboxIOSTests
    dependencies:
      - target: XJTUToolboxIOS
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.xjtu.toolbox.ios.tests
      GENERATE_INFOPLIST_FILE: YES
  XJTUToolboxIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - XJTUToolboxIOSUITests
    dependencies:
      - target: XJTUToolboxIOS
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.xjtu.toolbox.ios.uitests
      GENERATE_INFOPLIST_FILE: YES
schemes:
  XJTUToolboxIOS:
    build:
      targets:
        XJTUToolboxIOS: all
        XJTUToolboxIOSTests: [test]
        XJTUToolboxIOSUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - XJTUToolboxIOSTests
        - XJTUToolboxIOSUITests
    archive:
      config: Release
  XJTUToolboxIOS-PreviewAutoLogin:
    build:
      targets:
        XJTUToolboxIOS: all
    run:
      config: Debug
      commandLineArguments:
        "-XJTUPreviewAutoLogin": true
  XJTUToolboxIOS-PreviewAccountChoice:
    build:
      targets:
        XJTUToolboxIOS: all
    run:
      config: Debug
      commandLineArguments:
        "-XJTUPreviewAccountChoice": true
  XJTUToolboxIOS-RealLoginValidation:
    build:
      targets:
        XJTUToolboxIOS: all
    run:
      config: Debug
      commandLineArguments:
        "-XJTURealLoginValidation": true
        "-XJTUAuthNetworkDebug": true
  XJTUToolboxIOS-RealPublicData:
    build:
      targets:
        XJTUToolboxIOS: all
    run:
      config: Debug
      commandLineArguments:
        "-XJTUPreviewAutoLogin": true
        "-XJTURealPublicData": true
        "-XJTUAuthNetworkDebug": true
        "-XJTUStartTab": true
        "tools": true
  XJTUToolboxIOS-RealFirstReleaseCore:
    build:
      targets:
        XJTUToolboxIOS: all
    run:
      config: Debug
      commandLineArguments:
        "-XJTURealFirstReleaseCore": true
        "-XJTUAuthNetworkDebug": true
